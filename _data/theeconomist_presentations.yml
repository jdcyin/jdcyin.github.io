- title: "AI in health: from promise to proof"
  event: "Future of Health Asia 2026"
  location: "Singapore"
  role: "Moderator"
  date: 2026-09-29
  url: https://events.economistenterprise.com/future-of-health-asia/agenda/
  description: "Where AI in healthcare is delivering real clinical value, where it falls short, and how governance and regulation can build the trust needed to scale it."
  description_full: "Artificial intelligence (AI) is increasingly used in the health sector yet whereas some applications slot easily into existing systems, improving diagnostics and workflows, others struggle to scale beyond initial trials or fail to provide clinical value. This panel explores where AI is effective today and where it falls far short. What makes for a successful AI implementation that integrates safely into clinical workflows for measurable impact? How can concerns around data governance and sovereignty be resolved to generate the trust that will encourage larger-scale use of AI tools? And what role does regulation play in enabling—or blocking—AI-based innovation in healthcare?"

- title: "Care that fits: what works with patients’ lives"
  event: "Future of Health Asia 2026"
  location: "Singapore"
  role: "Moderator"
  date: 2026-09-29
  url: https://events.economistenterprise.com/future-of-health-asia/agenda/
  description: "How to make healthcare simpler, closer to home and designed around patients’ lives, with patients as active partners in their care."
  description_full: "Many people find healthcare expensive and hard to navigate. This session explores what gets in the way of providing care that is easy to understand, close to home and designed around peoples’ lives. Do patients get lost in the system and why? What can insurers, providers and governments do to simplify care without lowering standards or raising costs? How can health technology assessment go beyond clinical outcomes and cost-effectiveness to incorporate self-reported outcomes and real-world experience that reflect what patients really value? And how can patients become active partners in their care, rather than just passive recipients?"

- title: "Diagnostics first: scaling up the infrastructure"
  event: "Future of Health Asia 2026"
  location: "Singapore"
  role: "Moderator"
  date: 2026-09-29
  url: https://events.economistenterprise.com/future-of-health-asia/agenda/
  description: "Treating diagnostics as essential infrastructure: how to expand testing at scale and move towards precision medicine without widening gaps in access."
  description_full: "Diagnostics are essential for effective healthcare, yet access remains uneven in many markets, particularly low- and middle-income countries. Expanding testing capacity requires more than technology; it demands co-ordination between the public and private sectors, as well as investment and policy support. This session frames diagnostics as essential infrastructure, and examines how to fill the gaps. How can countries expand testing on a large scale? How can AI improve speed and accuracy? And how can systems move from basic screening to precision medicine without widening gaps in access?"

- title: "What's next for AI in Taiwan?: building a future-ready business"
  event: "Red Hat Executive Exchange"
  location: "Taipei, Taiwan"
  role: "Speaker and moderator"
  date: 2025-11-06
  description: "What it takes for businesses in Taiwan to become AI future-ready, from resilient strategy and responsible governance to the culture needed to embed AI."
  description_full: "As artificial intelligence moves from pilots to the core of business, what does it now mean for a company in Taiwan to be “AI future-ready”? This invitation-only panel, held at Red Hat’s Executive Exchange, explores how firms can build AI strategies that withstand both market shifts and geopolitical friction, and which industries and use cases in Taiwan are leading the charge. Can AI investments deliver lasting value to employees, customers and shareholders, or does the hype call for a more measured approach? How should executives weigh speed and cost against responsible AI, data sovereignty and regulatory expectations? And what cultural shifts and leadership mindsets are needed to embed AI across the enterprise, rather than treating it as a series of experiments?"

