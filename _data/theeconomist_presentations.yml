- title: "Regulatory frontiers: governing AI in health"
  event: "Future of Health Asia"
  location: "Singapore"
  role: "Moderator"
  date: 2025-10-01
  description: "How regulators can govern AI in medicine without compromising patient safety, accountability or ethics, and what best practice looks like for Asia."
  description_full: "As AI changes diagnostics, therapies and decision-making in healthcare, regulators must encourage innovation without compromising patient safety, data integrity or ethical standards. This session examines the emerging frameworks, uncertainties and global tensions around governing AI in medicine. From questions of accountability and bias to the pace of regulatory adaptation, it will consider whether laws can keep up with innovation. Are healthcare systems ready to trust AI with life-or-death decisions, or will regulatory caution delay adoption? What are the legal and ethical risks if AI-enabled tools misdiagnose, and who should bear responsibility? What are the global best practices, and how can they be adapted in the context of Asian economies?"

- title: "Climate action in healthcare: care for people and the planet"
  event: "Future of Health Asia"
  location: "Singapore"
  role: "Moderator"
  date: 2025-10-01
  description: "Why climate action must become a healthcare priority, and how to build greener, more resilient health systems."
  description_full: "Climate change is a crisis for the planet—and for human health. Yet the healthcare sector is not only on the frontlines of the response (such as for respiratory and heat-related illnesses) but also a contributor to environmental damage (from inefficient supply chains and care facilities). This session examines why climate action must become a healthcare priority and explores strategies for building greener, more resilient systems. What responsibility do insurers and healthcare payers have in promoting sustainability? Can the push for green healthcare coexist with profit and growth?"

- title: "Centering patient voices: understanding multidimensional access to healthcare"
  event: "Future of Health Asia"
  location: "Singapore"
  role: "Moderator"
  date: 2025-10-01
  description: "The barriers patients across Asia face in getting the right care at the right time, place and price, and how insurers and payers can help."
  description_full: "Access to healthcare is influenced by more than just proximity or cost. It involves a complex mix of system design, social context and lived experience. This panel brings together regional experts from across Asia to unpack the realities of healthcare access and identify the pain points patients face—an essential first step towards designing more connected care. What barriers do patients face on the path to the right care at the right time, place and price? How do patient experiences shape their trust in healthcare systems? How can insurers and payers better support health access across income and age groups?"

- title: "Smarter diagnoses, better treatments: the AI-enabled care shift"
  event: "Future of Health Asia"
  location: "Singapore"
  role: "Moderator"
  date: 2025-10-01
  description: "Where AI is genuinely transforming diagnosis and treatment, and the risks of bias and regulatory hurdles that still stand in the way."
  description_full: "From early cancer detection to personalised treatment plans, AI promises to revolutionise diagnostics and therapies. Healthcare systems are racing to adopt the technology. But the gap between potential and practice remains wide. This session looks beyond the headlines to explore where AI is truly transforming patient care, where it is falling short, and what risks and regulatory hurdles still stand in the way. How to ensure AI does not replicate biases in clinical decision-making, especially for underserved populations? Will the latest wave of AI tools enhance clinicians—or make them obsolete?"

- title: "Asia's moment in the sun: climate tech comes of age"
  event: "Tech for Change"
  location: "Hong Kong"
  role: "Moderator"
  date: 2025-03-01
  description: "How companies in Asia can harness climate technology to cut emissions while protecting their bottom line."
  description_full: "The target of net-zero emissions is a focus for governments and major companies. To achieve it, sustainability will need to be “baked in” to the technologies that power business activities. This session is a chance to interact with innovations in climate technology and discuss the latest trends in Asia and beyond. How can companies improve their bottom line while harnessing technologies to reduce their carbon footprint? Can technology make carbon credits and markets work smoothly? How can AI transform research on climate and waste reduction, and promote a thriving circular economy? Or, is the enthusiasm for AI diverting investment away from climate action? How can firms balance priorities for environmental conservation and financial returns? Where more could the government do to push the adoption of green tech?"

